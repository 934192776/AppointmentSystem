
{% extends 'base.html' %}
{% block content %}
<h1>欢迎来到 Piki Ora 医疗中心</h1>
{% if user.is_authenticated %}
    <p>欢迎，{{ user.username }}！</p>
    <a href="{% url 'doctor_list' %}" class="btn btn-primary">立即预约</a>
{% else %}
    <a href="{% url 'login' %}" class="btn btn-primary">登录</a>
    <a href="{% url 'register' %}" class="btn btn-success">注册</a>
{% endif %}
{% endblock %}
