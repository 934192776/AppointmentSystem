{% extends 'base.html' %}

<!-- 标题 -->
{% block title %}添加时间段 - 管理员{% endblock %}

{% block content %}

    <div class="col-md-6">
        <h1>添加时间段</h1>

    </div>
</div>
{% endblock %}
