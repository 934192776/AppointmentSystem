
{% extends 'base.html' %}

{% block title %}取消预约 - Piki Ora{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1>确认取消预约</h1>

        <!-- 预约信息卡片 -->
        <div class="card mb-4">
            <div class="card-body">
                <h5>医生：Dr. {{ appointment.time_slot.doctor.user.username }}</h5>
                <p><strong>日期：</strong>{{ appointment.time_slot.date }}</p>
                <p><strong>时间：</strong>{{ appointment.time_slot.start_time }}</p>
            </div>
        </div>

        <p>你确定要取消这个预约吗？</p>

        <!-- 确认取消表单 -->
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">确认取消</button>
            <a href="{% url 'my_appointments' %}" class="btn btn-secondary">返回</a>
        </form>
    </div>
</div>
{% endblock %}
