
{% extends 'base.html' %}

{% block title %}预约 - Dr. {{ slot.doctor.user.username }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1>确认预约</h1>

        <!-- 预约信息卡片 -->
        <div class="card mb-4">
            <div class="card-body">
                <h5>医生：Dr. {{ slot.doctor.user.username }}</h5>
                <p><strong>科室：</strong>{{ slot.doctor.specialty }}</p>
                <p><strong>日期：</strong>{{ slot.date }}</p>
                <p><strong>时间：</strong>{{ slot.start_time }}</p>
            </div>
        </div>

        <!-- 预约表 -->
        <form method="post">
            <!-- CSRF安全令牌 -->
            {% csrf_token %}

            <!-- 显示备注字段 -->
            {{ form.as_p }}

            <!-- 确认预约按钮 -->
            <button type="submit" class="btn btn-success">确认预约</button>

            <!-- 取消按钮 -->
            <a href="{% url 'doctor_detail' slot.doctor.id %}"
               class="btn btn-secondary">
                取消
            </a>
        </form>
    </div>
</div>
{% endblock %}
