
{% extends 'base.html' %}

{% block title %}删除医生 - 管理员{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1>确认删除</h1>

        <div class="alert alert-danger">
            <p>你确定要删除医生 <strong>Dr. {{ doctor.user.username }}</strong> 吗？</p>
            <p>此操作不可撤销！</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">确认删除</button>
            <a href="{% url 'manage_doctors' %}" class="btn btn-secondary">取消</a>
        </form>
    </div>
</div>
{% endblock %}
