
{% extends 'base.html' %}

{% block title %}注册 - Piki Ora 医疗中心{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>患者注册</h2>

        <!-- 注册表单 -->
        <form method="post">
            <!-- CSRF安全令牌 -->
            {% csrf_token %}

            <!-- 显示表单字段（Django自动生成） -->
            {{ form.as_p }}

            <!-- 注册按钮 -->
            <button type="submit" class="btn btn-success">注册</button>

            <!-- 登录链接 -->
            <a href="{% url 'login' %}" class="btn btn-secondary">已有账号？登录</a>
        </form>
    </div>
</div>
{% endblock %}
